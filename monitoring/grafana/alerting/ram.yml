apiVersion: 1
groups:
  - orgId: 1
    name: resource-alerts
    folder: LinkTracker
    interval: 1m
    rules:
      - uid: linktracker-memory
        title: LinkTracker RAM above 512 MiB
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              expr: process_resident_memory_bytes{job=~"bot|scrapper"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              type: math
              expression: $A > 536870912
              refId: C
