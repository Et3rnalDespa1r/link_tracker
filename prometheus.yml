global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'scrapper'
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: 'bot'
    static_configs:
      - targets: ['host.docker.internal:8011']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']